
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Gift Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1e1e2e;
      font-family: 'Press Start 2P', cursive;
    }

    /* Window Container */
    .app-window {
      width: 360px;
      height: 380px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.4s ease;
      position: relative;
    }

    /* Title Bar */
    .title-bar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(0,0,0,0.08);
    }

    .nav-btn {
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      border-radius: 3px;
    }

    .btn-minimize { background-color: #5c9df5; }
    .btn-close { background-color: #f55c7a; }

    /* Screen Content */
    .content-area {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .message-text {
      font-size: 11px;
      line-height: 1.6;
      color: #2b2b2b;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .pixel-art {
      margin: 10px 0;
      animation: float 2s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 150px;
    }

    .pixel-art svg {
      shape-rendering: crispEdges;
      max-width: 100%;
      max-height: 100%;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .action-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 8px 14px;
      background-color: #ffffff;
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #2b2b2b;
      transition: transform 0.1s;
    }

    .action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #2b2b2b;
    }

    /* Screen Theme Colors */
    .theme-1 { background-color: #fceecb; }
    .theme-2 { background-color: #ffb8ca; }
    .theme-3 { background-color: #aae0fa; }
    .theme-4 { background-color: #ffdca8; }
    .theme-5 { background-color: #a3f3d2; }
    .theme-6 { background-color: #bfb2f3; }
  </style>
</head>
<body>

      <div class="control-btn btn-close">&#10005;</div>

    <div class="message-text" id="typewriterText"></div>
    <div class="pixel-art" id="artContainer"></div>

      art: SVG_ASSETS.bunnyParty,

    {

      text: "huh? what's this ? looks like snoopy has a message !",
      art: SVG_ASSETS.snoopyFlower,
      hasBack: true,

      art: SVG_ASSETS.kuromiParty,
      hasBack: true,

    {
      theme: "theme-6",
      text: "From me... to you, ate kaira. So proud to know you and to be your friend. I hope you have a great year ahead, filled with love, laughter, and all the things that make you happy. You deserve it all! Keep shining bright.",
      art: SVG_ASSETS.friends,
      hasBack: true,
      btnText: null
    }

  let currentStep = 0;
  let typingTimer = null;

  const appWindow = document.getElementById("appWindow");
  const typewriterText = document.getElementById("typewriterText");
  const artContainer = document.getElementById("artContainer");
  const buttonContainer = document.getElementById("buttonContainer");
  const backBtn = document.getElementById("backBtn");

  function typeWriter(text, i = 0, callback = null) {
    if (i === 0) typewriterText.innerHTML = "";
    if (i < text.length) {
      typewriterText.innerHTML += text.charAt(i);
      typingTimer = setTimeout(() => typeWriter(text, i + 1, callback), 40);
    } else if (callback) {
      callback();
    }
  }

  function renderScreen(index) {
    clearTimeout(typingTimer);
    const data = screens[index];

    // Background theme update
    appWindow.className = `app-window ${data.theme}`;

    // Header controls
    backBtn.style.visibility = data.hasBack ? "visible" : "hidden";

    // Graphic
    artContainer.innerHTML = data.art;

    // Clear buttons
    buttonContainer.innerHTML = "";

    // Typewriter Text Effect
    typeWriter(data.text, 0, () => {
      // Show action button if required
      if (data.btnText) {
        const btn = document.createElement("button");
        btn.className = "action-btn";
        btn.innerText = data.btnText;
        btn.onclick = () => {
          if (data.nextOnClick !== undefined) {
            currentStep = data.nextOnClick;
            renderScreen(currentStep);
          }
        };
        buttonContainer.appendChild(btn);
      }

      // Auto progression after text finishes
      if (data.autoNextDelay) {
        setTimeout(() => {
          currentStep = data.nextScreen;
          renderScreen(currentStep);
        }, data.autoNextDelay);
      }
    });
  }

  // Back button functionality
  backBtn.onclick = () => {
    if (currentStep > 0) {
      currentStep--;
      renderScreen(currentStep);
    }
  };

  // Initial load auto-trigger (Screen 0 -> Screen 1 after short delay)
  renderScreen(0);
  setTimeout(() => {
    if (currentStep === 0) {
      currentStep = 1;
      renderScreen(1);
    }
  }, 2200);
</script>
</body>
</html>
